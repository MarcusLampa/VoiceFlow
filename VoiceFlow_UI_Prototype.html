<!doctype html>
<!-- PROTOTYPE ONLY. Question: What should the Windows dictation popup and its surrounding app feel like?
     Three structural directions on one standalone route, selected by ?variant=A|B|C.
     This is a browser stand-in for a future PySide6 Windows app, not production UI. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoiceFlow — throwaway UI study</title>
  <style>
    :root { font-family: 'DM Sans', 'Segoe UI', sans-serif; color: #182c37; background: #dce5e8; }
    * { box-sizing: border-box; }
    button, select, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #378ea6; outline-offset: 3px; }
    .app { min-height: 100vh; padding: 28px 28px 140px; }
    .study-header { max-width: 1320px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
    .eyebrow { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; font-weight: 800; }
    .study-header h1 { font: 800 24px Manrope, 'Segoe UI', sans-serif; margin: 5px 0 2px; }
    .study-header p { margin: 0; color: #52707b; font-size: 13px; }
    .study-badge { border: 1px solid #a6bbc2; padding: 8px 12px; border-radius: 100px; color: #4f6872; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
    .desktop { max-width: 1320px; height: min(740px, calc(100vh - 155px)); min-height: 610px; margin: auto; border: 1px solid #a8bcc3; border-radius: 16px; overflow: hidden; position: relative; background: #edf2f3; box-shadow: 0 28px 65px #34545c30; }
    .wallpaper { position: absolute; inset: 0; background: radial-gradient(circle at 18% 80%, #b2d5d1 0, transparent 43%), radial-gradient(circle at 77% 8%, #cfdee8 0, transparent 42%), linear-gradient(145deg, #eaf1ef, #d7e4e8); }
    .desktop-name { position: absolute; left: 35px; top: 26px; color: #617982; font-size: 12px; letter-spacing: .08em; font-weight: 700; text-transform: uppercase; }
    .editor { position: absolute; width: min(535px, 48%); left: 6%; top: 15%; bottom: 14%; background: #fff; border: 1px solid #c8d5d8; border-radius: 10px; box-shadow: 0 18px 50px #36515b1f; overflow: hidden; }
    .editor-top { height: 45px; display: flex; align-items: center; gap: 10px; padding: 0 17px; border-bottom: 1px solid #e9edef; color: #617880; font-size: 12px; }
    .editor-top span:first-child { width: 9px; height: 9px; border-radius: 50%; background: #dfad8c; }
    .editor-body { padding: 30px 36px; height: calc(100% - 45px); }
    .editor-body h2 { font: 800 21px Manrope, sans-serif; margin: 0 0 10px; color: #2c4047; }
    .editor-body p { font-size: 13px; color: #7b8f95; line-height: 1.7; }
    .editor-body textarea { display: block; width: 100%; height: 55%; resize: none; border: 0; border-top: 1px solid #e4ecee; padding: 18px 0; margin-top: 23px; font: 15px/1.8 'Segoe UI', sans-serif; color: #364d55; background: transparent; }
    .editor-body textarea:focus { outline: none; }
    .editor-foot { position: absolute; bottom: 24px; color: #94a5aa; font-size: 11px; }
    .taskbar { position: absolute; bottom: 0; left: 0; right: 0; height: 48px; background: #f5f8f9e8; backdrop-filter: blur(14px); border-top: 1px solid #ffffffb8; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 12px; color: #58717b; }
    .taskbar button { border: 0; background: transparent; color: #41616b; padding: 7px 10px; border-radius: 7px; font-weight: 700; }
    .taskbar button:hover { background: #d9e7eb; }
    .mock-window { position: absolute; z-index: 2; box-shadow: 0 26px 65px #17313f3e, 0 0 0 1px #ffffff78; }
    .tiny { font-size: 11px; }
    .mono { font-family: Consolas, 'Courier New', monospace; }
    .muted { opacity: .64; }
    .wave { display: flex; align-items: center; justify-content: center; gap: 3px; height: 42px; }
    .wave i { display: block; width: 3px; border-radius: 4px; background: currentColor; height: var(--h); opacity: .8; }
    .wave.is-still i { height: 3px; opacity: .4; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ed7963; vertical-align: middle; margin-right: 7px; box-shadow: 0 0 0 4px #ed796327; }
    .status-dot.done { background: #53aa8a; box-shadow: 0 0 0 4px #53aa8a25; }
    .status-dot.wait { background: #e9ad55; box-shadow: 0 0 0 4px #e9ad5529; }
    .status-dot.error { background: #e06161; box-shadow: 0 0 0 4px #e0616129; }
    .wave-wrap { color: #f78472; }
    .action { border: 0; border-radius: 9px; padding: 10px 17px; font-weight: 800; background: #f47e6e; color: white; }
    .action:hover { filter: brightness(.94); }
    .subtle-button { border: 1px solid #cbd9dc; background: transparent; color: inherit; border-radius: 9px; padding: 8px 10px; }
    /* A: a deliberately small, peripheral toolbar */
    .variant-a .mock-window { right: 5%; top: 23%; width: 320px; border: 1px solid #ffffff24; border-radius: 17px; background: linear-gradient(145deg, #141519e8, #1d1e23cc); color: #f2f0ec; padding: 19px; backdrop-filter: blur(22px) saturate(120%); -webkit-backdrop-filter: blur(22px) saturate(120%); box-shadow: 0 28px 70px #11131870, inset 0 1px #ffffff26; }
    .a-head, .a-bottom { display: flex; align-items: center; justify-content: space-between; }
    .a-head strong { font: 800 15px Manrope, sans-serif; letter-spacing: -.03em; }
    .a-head button { border: 1px solid #ffffff18; background: #ffffff12; color: #dedbd5; border-radius: 7px; width: 28px; height: 28px; }
    .a-status { margin: 28px 0 16px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .a-time { font: 700 27px Manrope, sans-serif; letter-spacing: -.06em; }
    .a-wave { background: #ffffff0e; border: 1px solid #ffffff0e; border-radius: 9px; margin: 0 0 15px; height: 49px; color: #e9a18e; }
    .a-caption { font-size: 11px; line-height: 1.6; color: #b8b6b3; min-height: 36px; margin-bottom: 17px; }
    .a-mode { width: 138px; }
    .a-switch { position: relative; display: flex; width: 138px; height: 40px; padding: 4px; border: 1px solid #ffffff22; border-radius: 11px; background: #ffffff12; }
    .a-switch::before { content: ''; position: absolute; left: 4px; top: 4px; width: calc(50% - 4px); height: 30px; border-radius: 7px; background: #e2ded7; box-shadow: 0 2px 8px #0005; transform: translateX(0); transition: transform .2s ease; }
    .a-switch.is-clipboard::before { transform: translateX(64px); }
    .a-switch button { position: relative; z-index: 1; flex: 1; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #b4b1ad; border-radius: 7px; }
    .a-switch button[aria-pressed="true"] { color: #25262a; }
    .a-switch button:disabled { cursor: default; }
    .a-switch svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .a-bottom .action { min-width: 92px; height: 40px; background: #d77e70; }
    .a-footer { border-top: 1px solid #ffffff20; margin-top: 18px; padding-top: 12px; font-size: 10px; color: #a9a6a2; display: flex; justify-content: space-between; }
    /* B: transcript-first, editorial panel */
    .variant-b .mock-window { right: 4%; top: 11%; bottom: 12%; width: min(410px, 43%); border-radius: 8px; background: #fcfaf3; color: #203a3a; display: flex; flex-direction: column; }
    .b-top { padding: 25px 27px 17px; border-bottom: 1px solid #dfddd1; display: flex; justify-content: space-between; align-items: flex-start; }
    .b-top h2 { font: 800 23px Manrope, sans-serif; letter-spacing: -.07em; margin: 5px 0 0; }
    .b-top button { border: 0; background: transparent; font-size: 21px; color: #53736a; }
    .b-progress { padding: 20px 27px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; }
    .b-progress .wave { width: 112px; color: #cd7657; }
    .b-paper { flex: 1; overflow: auto; margin: 0 27px; border-top: 1px solid #dfddd1; padding: 20px 0; font: 15px/1.8 Georgia, serif; }
    .b-paper .stamp { color: #b48768; font: 11px/2 Consolas, monospace; }
    .b-paper p { margin: 0 0 18px; }
    .b-placeholder { color: #a2a99d; font-style: italic; }
    .b-footer { padding: 18px 27px 24px; border-top: 1px solid #dfddd1; }
    .b-footer label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; display: block; margin-bottom: 9px; }
    .b-footer select { border: 1px solid #c7d4ce; background: white; padding: 10px; border-radius: 5px; width: 100%; color: #203a3a; }
    .b-footer .action { background: #244f48; width: 100%; margin-top: 12px; }
    .b-footer small { display: block; color: #768a82; margin-top: 10px; }
    /* C: operational console with explicit progress and delivery */
    .variant-c .mock-window { right: 5%; top: 19%; width: min(465px, 46%); background: #f8fafc; border: 1px solid #d1dfe5; border-radius: 13px; color: #183545; overflow: hidden; }
    .c-top { background: #e8f1f5; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    .c-top strong { font: 800 15px Manrope, sans-serif; }
    .c-top button { background: white; border: 1px solid #c5d7e0; border-radius: 6px; padding: 5px 8px; color: #375869; }
    .c-body { display: grid; grid-template-columns: 125px 1fr; gap: 20px; padding: 24px 20px 17px; }
    .c-meter { background: #164b62; border-radius: 9px; color: white; text-align: center; padding: 16px 7px; }
    .c-meter .wave { color: #77d6cd; }
    .c-meter strong { display: block; font: 800 21px Manrope, sans-serif; margin-top: 9px; }
    .c-data h2 { font: 800 17px Manrope, sans-serif; margin: 0 0 9px; }
    .c-data p { margin: 0 0 11px; font-size: 12px; line-height: 1.5; color: #587482; }
    .c-data .line { border-top: 1px solid #dce6eb; padding: 8px 0; display: flex; justify-content: space-between; gap: 8px; font-size: 11px; }
    .c-data .line b { text-align: right; }
    .c-delivery { margin: 0 20px 17px; padding: 15px; border: 1px solid #d9e3e9; border-radius: 8px; }
    .c-delivery label { display: block; font-size: 11px; font-weight: 800; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .09em; }
    .c-delivery select { width: 100%; border: 1px solid #c4d6de; border-radius: 6px; padding: 8px; background: white; }
    .c-actions { padding: 0 20px 21px; display: flex; gap: 8px; }
    .c-actions .action { flex: 1; background: #167b89; }
    /* Settings are a shared context surface, not the layout being compared. */
    .settings { position: absolute; z-index: 5; top: 9%; left: 50%; transform: translateX(-50%); width: min(640px, calc(100% - 28px)); max-height: 78%; overflow: auto; background: #fff; border-radius: 12px; box-shadow: 0 24px 80px #13313d6b; }
    .settings header { padding: 22px 26px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5eef0; }
    .settings header h2 { margin: 0; font: 800 20px Manrope, sans-serif; }
    .settings header button { background: transparent; border: 0; color: #47636f; }
    .settings-grid { padding: 24px 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 19px; }
    .settings-grid label { display: block; font-size: 12px; font-weight: 700; }
    .settings-grid input, .settings-grid select { width: 100%; margin-top: 7px; border: 1px solid #cbdade; border-radius: 7px; padding: 10px; background: #fff; color: #183545; }
    .settings-grid .wide { grid-column: span 2; }
    .settings-grid .check { display: flex; align-items: center; gap: 8px; }
    .settings-grid .check input { width: auto; margin: 0; }
    .settings footer { border-top: 1px solid #e5eef0; padding: 15px 26px; font-size: 11px; color: #59727c; }
    .study-panel { max-width: 1320px; margin: 16px auto 0; display: grid; grid-template-columns: 1fr minmax(290px, 410px); gap: 12px; }
    .demo, .state-panel { background: #fff; border: 1px solid #c2d2d7; border-radius: 10px; padding: 14px 18px; }
    .demo h2, .state-panel h2 { font: 800 12px Manrope, sans-serif; margin: 0 0 7px; text-transform: uppercase; letter-spacing: .1em; }
    .demo p { color: #607b85; margin: 0 0 11px; font-size: 12px; }
    .demo button { margin: 0 6px 7px 0; padding: 7px 9px; background: #f1f6f7; border: 1px solid #cbdce0; border-radius: 6px; color: #365c68; font-size: 11px; }
    .state-panel pre { margin: 0; max-height: 120px; overflow: auto; font: 11px/1.4 Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .switcher { position: fixed; z-index: 20; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; padding: 7px; background: #102b38; color: white; border-radius: 100px; box-shadow: 0 10px 35px #0d344877; font-size: 12px; white-space: nowrap; }
    .switcher button { border: 0; width: 36px; height: 36px; background: #304e5a; color: white; border-radius: 50%; font-size: 20px; }
    .switcher button:hover { background: #477381; }
    .switcher span { min-width: 180px; text-align: center; }
    @media (max-width: 780px) {
      .app { padding: 16px 12px 120px; }
      .study-badge { display: none; }
      .desktop { min-height: 790px; height: 790px; }
      .editor { width: 88%; left: 6%; top: 9%; height: 250px; bottom: auto; }
      .editor-body { padding: 15px 20px; }
      .editor-body textarea { margin-top: 8px; height: 85px; }
      .editor-foot { display: none; }
      .variant-a .mock-window, .variant-b .mock-window, .variant-c .mock-window { left: 50%; right: auto; transform: translateX(-50%); top: 395px; bottom: auto; width: min(440px, 91%); }
      .variant-b .mock-window { height: 340px; }
      .variant-b .b-top { padding: 13px 17px; }
      .variant-b .b-progress, .variant-b .b-footer { padding: 9px 17px; }
      .variant-b .b-paper { margin: 0 17px; padding: 9px 0; }
      .study-panel { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // All content and interactions below are simulated and live in memory only.
    const names = { A: 'Quiet companion', B: 'Live notebook', C: 'Session console' };
    const variants = Object.keys(names);
    const params = new URLSearchParams(location.search);
    let variant = variants.includes(params.get('variant')) ? params.get('variant') : 'A';
    const state = {
      phase: 'recording', elapsed: '01:42', mode: 'Clipboard', lastMode: 'Clipboard', draft: '',
      target: 'Planning notes · Draft', microphone: 'Default microphone', model: 'large-v3',
      language: 'English', output: 'D:\\Voice Notes', hotkey: 'Ctrl+Space', sounds: true,
      transcript: ['I have been thinking about the architecture.', 'Another option is to reference it by ID.'],
      backlog: 1, audioSaved: true, transcriptSaved: true, notice: '', settingsOpen: false
    };
    const escapeHtml = (text) => String(text).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
    const dot = () => `<span class="status-dot ${state.phase === 'completed' ? 'done' : state.phase === 'finalizing' ? 'wait' : ['interrupted','incomplete transcription'].includes(state.phase) ? 'error' : ''}"></span>`;
    const active = () => state.phase === 'recording';
    const label = () => ({ recording: 'Recording', finalizing: 'Finalizing transcript', completed: 'Completed', interrupted: 'Interrupted', 'incomplete transcription': 'Incomplete transcription', discarded: 'No speech · discarded' })[state.phase];
    const message = () => state.notice || ({ recording: 'Audio is saved continuously. Transcript appears as phrases finish.', finalizing: 'Capture has stopped. Finishing remaining speech before delivery.', completed: state.mode === 'File' ? 'Text and audio saved to session files.' : state.mode === 'Clipboard' ? 'Finished text copied to clipboard.' : 'Finished text delivered to the original selected field.', interrupted: 'Capture stopped unexpectedly. Saved material is available in the session folder.', 'incomplete transcription': 'Original audio saved. Partial text will not be delivered automatically.', discarded: 'No speech detected; session discarded.' })[state.phase];
    const modeSelect = () => `<select aria-label="Delivery mode" data-setting="mode" ${active() ? '' : 'disabled'}>${['File','Clipboard','Selected field'].map(m => `<option ${m === state.mode ? 'selected' : ''}>${m}</option>`).join('')}</select>`;
    const wave = () => `<div class="wave ${active() ? '' : 'is-still'}" aria-hidden="true">${[7,15,22,12,30,18,11,27,37,15,26,12,33,19,11,24,8].map(h => `<i style="--h:${h}px"></i>`).join('')}</div>`;
    const primary = () => `<button class="action" data-action="${active() ? 'stop' : 'start'}" ${state.phase === 'finalizing' ? 'disabled' : ''}>${active() ? '■ Stop' : state.phase === 'finalizing' ? 'Finishing…' : '● Start again'}</button>`;

    function variantA() {
      const documentIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2.5h8l4 4V21H6zM14 2.5V7h4M9 11h6M9 14h6M9 17h4"/></svg>';
      const pasteIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="15" height="18" rx="2"/><path d="M9 4.5V3h7v3H9zM12.5 10v7m-3-3 3 3 3-3"/></svg>';
      return `<section class="mock-window" aria-label="Quiet companion recording popup">
        <div class="a-head"><strong>◉ &nbsp; VoiceFlow</strong><button data-action="settings" aria-label="Open settings">⚙</button></div>
        <div class="a-status"><span>${dot()}${label()}</span><span class="a-time">${state.elapsed}</span></div>
        <div class="a-wave">${wave()}</div>${active() ? '' : `<div class="a-caption">${escapeHtml(message())}</div>`}
        <div class="a-bottom"><div class="a-mode"><div class="a-switch ${state.mode === 'Clipboard' ? 'is-clipboard' : ''}" role="group" aria-label="Delivery mode">
          <button data-mode="File" aria-label="Document: save finished text to session files" title="Document" aria-pressed="${state.mode === 'File'}" ${active() ? '' : 'disabled'}>${documentIcon}</button>
          <button data-mode="Clipboard" aria-label="Clipboard: copy finished text" title="Clipboard" aria-pressed="${state.mode === 'Clipboard'}" ${active() ? '' : 'disabled'}>${pasteIcon}</button>
        </div></div>${primary()}</div>
        <div class="a-footer"><span>⌨ Ctrl+M to change mode</span><span>Audio kept unless silent</span></div>
      </section>`;
    }
    function variantB() {
      return `<section class="mock-window" aria-label="Live notebook recording popup">
        <div class="b-top"><div><div class="eyebrow">VoiceFlow / live session</div><h2>Make room for ideas.</h2></div><button data-action="settings" aria-label="Open settings">⚙</button></div>
        <div class="b-progress"><span>${dot()}${label()} · ${state.elapsed}</span>${wave()}</div>
        <div class="b-paper">${state.transcript.length ? state.transcript.map((line, i) => `<p><span class="stamp">[00:00:${i ? '19' : '07'}]</span><br>${escapeHtml(line)}</p>`).join('') : '<p class="b-placeholder">Your words will appear here as phrases finish.</p>'}
          <p class="b-placeholder">${escapeHtml(message())}</p></div>
        <div class="b-footer"><label>When you finish, send text to</label>${modeSelect()}${primary()}<small>Audio and raw transcript stay in the session folder unless confirmed silent.</small></div>
      </section>`;
    }
    function variantC() {
      return `<section class="mock-window" aria-label="Session console recording popup">
        <div class="c-top"><strong>▦ &nbsp; VoiceFlow / Session</strong><button data-action="settings">⚙ Settings</button></div>
        <div class="c-body"><div class="c-meter">${wave()}<strong>${state.elapsed}</strong><span class="tiny">${active() ? 'CAPTURING' : 'CAPTURE ENDED'}</span></div>
          <div class="c-data"><h2>${dot()}${label()}</h2><p>${escapeHtml(message())}</p>
          <div class="line"><span>Original audio</span><b>${state.audioSaved ? 'Saved locally' : 'Discarded'}</b></div>
          <div class="line"><span>Transcript</span><b>${state.transcriptSaved ? `${state.transcript.length} phrases saved` : 'Unavailable'}</b></div>
          <div class="line"><span>Waiting to transcribe</span><b>${state.backlog} ${state.backlog === 1 ? 'phrase' : 'phrases'}</b></div></div></div>
        <div class="c-delivery"><label>Delivery after finalization</label>${modeSelect()}<div class="tiny muted" style="margin-top:8px">Selected field: ${escapeHtml(state.target)}</div></div>
        <div class="c-actions">${primary()}<button class="subtle-button" data-action="folder">Open session folder ↗</button></div>
      </section>`;
    }
    function settings() {
      return `<section class="settings" role="dialog" aria-modal="true" aria-label="VoiceFlow settings"><header><h2>Settings</h2><button data-action="settings" aria-label="Close settings">✕</button></header>
        <div class="settings-grid">
          <label>Microphone<select data-setting="microphone"><option ${state.microphone === 'Default microphone' ? 'selected' : ''}>Default microphone</option><option ${state.microphone === 'USB microphone' ? 'selected' : ''}>USB microphone</option></select></label>
          <label>Speech model<select data-setting="model"><option ${state.model === 'large-v3' ? 'selected' : ''}>large-v3</option><option ${state.model === 'small' ? 'selected' : ''}>small</option></select></label>
          <label class="wide">Output folder<input data-setting="output" value="${escapeHtml(state.output)}"></label>
          <label>Start / stop hotkey<input data-setting="hotkey" value="${escapeHtml(state.hotkey)}"></label>
          <label>Language<select data-setting="language"><option>English</option></select></label>
          <label class="check wide"><input type="checkbox" data-setting="sounds" ${state.sounds ? 'checked' : ''}> Play recording feedback sounds</label>
        </div><footer>Prototype controls only · settings are not saved · closing settings returns to the tray.</footer></section>`;
    }
    function render() {
      document.getElementById('root').innerHTML = `<main class="app variant-${variant.toLowerCase()}">
        <header class="study-header"><div><div class="eyebrow">VoiceFlow / Design study 01</div><h1>What should dictation feel like?</h1><p>Three directions for the recording popup, seen next to the field you started from.</p></div><span class="study-badge">Throwaway prototype · simulated</span></header>
        <div class="desktop"><div class="wallpaper"></div><span class="desktop-name">Your Windows desktop · illustrative</span>
          <div class="editor"><div class="editor-top"><span></span>Planning notes · Draft</div><div class="editor-body"><h2>Planning notes</h2><p>A stand-in for another application. VoiceFlow remembers this field before its popup opens.</p><textarea aria-label="Example target field" placeholder="Your cursor was here before recording started…">${escapeHtml(state.draft)}</textarea><span class="editor-foot">This is a simulated target field; no real text is pasted.</span></div></div>
          ${({ A:variantA, B:variantB, C:variantC })[variant]()}
          <div class="taskbar"><span>▦ &nbsp; Windows &nbsp; · &nbsp; Planning notes</span><button data-action="settings">◉ VoiceFlow tray · Settings</button></div>
          ${state.settingsOpen ? settings() : ''}
        </div>
        <div class="study-panel"><section class="demo"><h2>Preview scenarios</h2><p>Simulate outcomes from the project plan. No microphone, clipboard, files or global shortcuts are touched.</p>
          <button data-action="phrase">+ Recognized phrase</button><button data-action="stop">Stop capture</button><button data-action="finish">Finish transcript</button><button data-action="fail">Transcription fails</button><button data-action="silent">Confirmed silence</button><button data-action="interrupt">Mic / write failure</button><button data-action="unsafe">Selected field unavailable</button><button data-action="start">New session</button>
        </section><section class="state-panel"><h2>Simulated state · updates after every action / variant switch</h2><pre>${escapeHtml(JSON.stringify({ variant, ...state }, null, 2))}</pre></section></div>
        ${['127.0.0.1','localhost'].includes(location.hostname) || location.protocol === 'file:' ? `<nav class="switcher" aria-label="Prototype variants"><button data-switch="-1" aria-label="Previous variant">←</button><span>${variant} · ${names[variant]}</span><button data-switch="1" aria-label="Next variant">→</button></nav>` : ''}
      </main>`;
    }
    function switchVariant(direction) {
      variant = variants[(variants.indexOf(variant) + direction + variants.length) % variants.length];
      if (variant === 'A' && state.mode === 'Selected field') state.mode = 'Clipboard';
      const url = new URL(location.href); url.searchParams.set('variant', variant);
      history.replaceState(null, '', url); render();
    }
    function act(action) {
      if (action === 'settings') state.settingsOpen = !state.settingsOpen;
      if (action === 'folder') state.notice = 'Prototype: session files would open in Explorer.';
      if (action === 'phrase' && active()) { state.transcript.push('We should keep the original audio as the source of truth.'); state.backlog = Math.max(0, state.backlog - 1); }
      if (action === 'stop' && active()) { state.phase = 'finalizing'; state.lastMode = state.mode; state.notice = ''; }
      if (action === 'finish' && state.phase === 'finalizing') { state.phase = 'completed'; state.backlog = 0; state.notice = ''; }
      if (action === 'fail' && ['recording','finalizing'].includes(state.phase)) { state.phase = 'incomplete transcription'; state.transcriptSaved = state.transcript.length > 0; state.notice = ''; }
      if (action === 'silent' && ['recording','finalizing'].includes(state.phase)) { state.phase = 'discarded'; state.audioSaved = false; state.transcriptSaved = false; state.transcript = []; state.backlog = 0; state.notice = ''; }
      if (action === 'interrupt' && ['recording','finalizing'].includes(state.phase)) { state.phase = 'interrupted'; state.notice = ''; }
      if (action === 'unsafe' && state.phase === 'completed' && state.mode === 'Selected field') state.notice = 'Original field could not be verified. Text stays on the clipboard; nothing was pasted.';
      if (action === 'start' && !['recording','finalizing'].includes(state.phase)) {
        Object.assign(state, { phase:'recording', elapsed:'00:00', mode:state.lastMode, transcript:[], backlog:0, audioSaved:true, transcriptSaved:true, notice:'', settingsOpen:false });
      }
      render();
    }
    document.addEventListener('click', event => {
      const switchButton = event.target.closest('[data-switch]');
      if (switchButton) return switchVariant(Number(switchButton.dataset.switch));
      const modeButton = event.target.closest('[data-mode]');
      if (modeButton && active()) { state.mode = modeButton.dataset.mode; render(); return; }
      const button = event.target.closest('[data-action]'); if (button) act(button.dataset.action);
    });
    document.addEventListener('change', event => {
      const key = event.target.dataset.setting;
      if (!key) return;
      state[key] = key === 'sounds' ? event.target.checked : event.target.value;
      render();
    });
    document.addEventListener('input', event => {
      if (event.target.matches('.editor textarea')) {
        state.draft = event.target.value;
        document.querySelector('.state-panel pre').textContent = JSON.stringify({ variant, ...state }, null, 2);
      }
    });
    document.addEventListener('keydown', event => {
      if (event.ctrlKey && !event.altKey && !event.metaKey && event.key.toLowerCase() === 'm' && active()) {
        event.preventDefault();
        state.mode = variant === 'A' ? (state.mode === 'File' ? 'Clipboard' : 'File') : ({ File:'Clipboard', Clipboard:'Selected field', 'Selected field':'File' })[state.mode];
        render();
        return;
      }
      if (event.altKey || event.ctrlKey || event.metaKey || event.target.closest('input, textarea, select, [contenteditable]')) return;
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') { event.preventDefault(); switchVariant(event.key === 'ArrowRight' ? 1 : -1); }
    });
    window.addEventListener('popstate', () => { variant = variants.includes(new URLSearchParams(location.search).get('variant')) ? new URLSearchParams(location.search).get('variant') : 'A'; if (variant === 'A' && state.mode === 'Selected field') state.mode = 'Clipboard'; render(); });
    render();
  </script>
</body>
</html>
